apiVersion: v1
kind: Service

metadata:
  name: {{ include "openbao.fullname" . }}-headless
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  clusterIP: None

  selector:
    {{- include "openbao.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server

  ports:
    - name: {{ if .Values.tls.enabled }}https{{ else }}http{{ end }}
      port: {{ .Values.service.port }}
      targetPort: api
    - name: cluster
      port: {{ .Values.service.clusterPort }}
      targetPort: cluster