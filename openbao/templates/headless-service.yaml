apiVersion: v1
kind: Service

metadata:
  name: {{ .Release.Name }}-headless

spec:
  clusterIP: None

  selector:
    app: {{ .Release.Name }}

  ports:
    - name: api
      port: {{ .Values.service.port}}
      targetPort: {{ .Values.service.port}}

    - name: cluster
      port: {{ .Values.service.clusterPort}}
      targetPort: {{ .Values.service.clusterPort}}