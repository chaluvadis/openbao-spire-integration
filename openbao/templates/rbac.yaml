apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: {{ .Release.Name }}

rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/status
      - namespaces
    verbs:
      - get
      - list
      - watch
      - patch
      - update

  - apiGroups: [""]
    resources:
      - services
      - nodes
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: {{ .Release.Name }}

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}

subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}