apiVersion: v1
kind: Service

metadata:
  name: {{ include "openbao.fullname" . }}
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with merge .Values.service.annotations .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  selector:
    {{- include "openbao.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server

  ports:
    - name: {{ if .Values.tls.enabled }}https{{ else }}http{{ end }}
      port: {{ .Values.service.port }}
      targetPort: api
      protocol: TCP

  type: {{ .Values.service.type }}