apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: {{ .Release.Name }}

spec:
  serviceName: {{ .Release.Name }}-headless
  replicas: {{ .Values.serverReplicaCount }}

  selector:
    matchLabels:
      app: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}

    spec:
      serviceAccountName: {{ .Release.Name }}

      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

      containers:
        - name: openbao

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          args:
            - "server"
            - "-config=/etc/openbao/openbao.hcl"

          ports:
            - name: api
              containerPort: {{ .Values.service.port}}

            - name: cluster
              containerPort: {{ .Values.service.clusterPort}}

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: BAO_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: BAO_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: config
              mountPath: /etc/openbao

            - name: data
              mountPath: /openbao/data

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi

      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config

  volumeClaimTemplates:
    - metadata:
        name: data

      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.dataStorage.storageClass }}

        resources:
          requests:
            storage: {{ .Values.dataStorage.size }}