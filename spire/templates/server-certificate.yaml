apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: spire-server-tls
  namespace: {{ .Release.Namespace }}

spec:
  secretName: spire-server-tls

  issuerRef:
    name: spire-selfsigned
    kind: ClusterIssuer

  dnsNames:
    - spire-server
    - spire-server.{{ .Release.Namespace }}.svc.cluster.local