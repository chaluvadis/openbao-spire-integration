apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "spire.server.name" . }}

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "spire.server.name" . }}

subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.server }}
    namespace: {{ .Release.Namespace }}