apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spire.server" . }}-config
  labels:
    {{- include "spire.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

data:
  server.conf.tpl: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "{{ .Values.server.port }}"
      trust_domain = "{{ .Values.trustDomain }}"
      data_dir = "/run/spire/data"
      log_level = "INFO"
    }

    plugins {

      DataStore "sql" {
        plugin_data {
          database_type = "postgres"
          {{- if .Values.storage.postgres.existingSecret }}
          connection_string = "host={{ .Values.storage.postgres.host }} port={{ .Values.storage.postgres.port }} dbname={{ .Values.storage.postgres.db }} user={{ .Values.storage.postgres.user }} password=SPIRE_DB_PASSWORD_PLACEHOLDER sslmode={{ .Values.storage.postgres.sslmode }}"
          {{- else }}
          connection_string = "host={{ .Values.storage.postgres.host }} port={{ .Values.storage.postgres.port }} dbname={{ .Values.storage.postgres.db }} user={{ .Values.storage.postgres.user }} sslmode={{ .Values.storage.postgres.sslmode }}"
          {{- end }}
        }
      }

      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "{{ .Release.Name }}" = {}
          }
        }
      }

      KeyManager "memory" {}
    }