apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: {{ include "spire.server" . }}

spec:
  serviceName: {{ include "spire.server" . }}
  replicas: {{ .Values.server.replicas }}

  selector:
    matchLabels:
      app: {{ include "spire.server" . }}

  template:
    metadata:
      labels:
        app: {{ include "spire.server" . }}

    spec:
      serviceAccountName: {{ include "spire.server" . }}

      containers:
        - name: spire-server
          image: "{{ .Values.server.image }}:{{ .Values.server.tag }}"

          args:
            - "-config"
            - "/run/spire/config/server.conf"

          ports:
            - containerPort: {{ .Values.server.port }}

          volumeMounts:
            - name: config
              mountPath: /run/spire/config
            - name: data
              mountPath: /run/spire/data

      volumes:
        - name: config
          configMap:
            name: {{ include "spire.server" . }}-config

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.class | default "vsphere-db" }}
        resources:
          requests:
            storage: {{ .Values.storage.size | default "1Gi" }}