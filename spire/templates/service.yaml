apiVersion: v1
kind: Service
metadata:
  name: {{ include "spire.server.name" . }}

spec:
  selector:
    app: {{ include "spire.server.name" . }}

  ports:
    - name: api
      port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
    - name: bundle
      port: {{ .Values.server.bundlePort }}
      targetPort: {{ .Values.server.bundlePort }}