apiVersion: v1
kind: Service
metadata:
  name: {{ include "spire.server" . }}
  labels:
    {{- include "spire.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  selector:
    {{- include "spire.server.selectorLabels" . | nindent 4 }}

  ports:
    - name: grpc
      port: {{ .Values.server.port }}
      targetPort: grpc
      protocol: TCP